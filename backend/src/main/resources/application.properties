server.port=${PORT:4000}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inquiro_tracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:database/schema.sql
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.require-https=${REQUIRE_HTTPS:true}
app.auth.invite-code=${STAFF_SIGNUP_INVITE_CODE:}
app.auth.trusted-proxies=${TRUSTED_PROXY_ADDRESSES:}
